; Model presets for llama-server in router mode, one section per model. The
; section name is the model name a request asks for. scripts/serve_models.sh
; starts the router from the repository root, so paths are relative to it, and
; sets the router's own flags: --models-max 1 and --host 127.0.0.1.
version = 1

[*]
; Every layer on the GPU and no automatic fitting. A preset that does not fit
; fails to load instead of quietly moving layers to the CPU or shrinking the
; context, so what the smoke test measures is what runs.
n-gpu-layers = all
fit = off
; One slot: requests are sequential.
parallel = 1

[qwen3.5-9b]
model = models/qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 8192

[qwen3.5-4b]
model = models/qwen3.5-4b/Qwen3.5-4B-Q4_K_M.gguf
ctx-size = 8192
