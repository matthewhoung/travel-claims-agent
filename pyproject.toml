[project]
name = "travel-claims-agent"
version = "0.1.0"
description = "Compare travel-inconvenience insurance claim conditions across insurers, locally"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pdfplumber>=0.11.10",
]

[project.scripts]
travel-claims = "travel_claims.cli:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10"]
build-backend = "uv_build"

[tool.uv]
# asdf provides the interpreter (.tool-versions); uv only manages packages.
python-preference = "only-system"

[tool.uv.build-backend]
module-name = "travel_claims"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
